<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân của tôi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-image: radial-gradient(#e0e7ff 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 580px;
            width: 90%;
            text-align: left;
            border: 1px solid #e5e7eb;
            backdrop-filter: blur(10px);
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            color: #3b82f6;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            font-size: 40px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
            border: 4px solid white;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            color: #111827;
            font-weight: 700;
        }

        .role {
            font-size: 16px;
            color: #4b5563;
            margin-top: 5px;
            font-weight: 400;
        }

        .description {
            font-size: 16px;
            color: #374151;
            line-height: 1.7;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        .btn-primary, .btn-secondary {
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: #111827;
color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #1f2937;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary {
            background-color: transparent;
            color: #111827;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
            transform: translateY(-3px);
        }

        .footer {
            font-size: 14px;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 25px;
            font-weight: 300;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icon {
            color: #9ca3af;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icon:hover {
            color: #111827;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="subtitle">XIN CHÀO, MÌNH LÀ</div>
        
        <div class="header-section">
            <div class="avatar">V</div>
            <div>
                <h1>Thanh Vân</h1>
                <div class="role">Nhà phát triển web </div>
            </div>
        </div>

        <div class="description">
            Mình xây dựng những trải nghiệm web đơn giản, đẹp mắt và dễ sử dụng. Trang này là nơi bạn có thể tìm hiểu thêm về mình, các dự án và cách liên hệ.
        </div>

        <div class="buttons">
            <a href="#" class="btn-primary">Liên hệ với mình</a>
            <a href="#" class="btn-secondary">Xem dự án</a>
        </div>

        <div class="footer">
            <div>&copy; 2026 Thanh Vân · Hải Phòng, Việt Nam</div>
            <div class="social-icons">
                <a href="#" class="social-icon">GitHub</a>
                <a href="#" class="social-icon">Facebook</a>
            </div>
        </div>
    </div>

</body>
</html>
